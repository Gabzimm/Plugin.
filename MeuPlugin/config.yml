# ====================================
# DiscordVinculador - Configuração
# ====================================

discord:
  # Token do seu bot Discord
  # Pegue em: https://discord.com/developers/applications
  token: "SEU_TOKEN_AQUI"
  
  # ID do seu servidor Discord
  # Ative o modo desenvolvedor no Discord e copie o ID
  guild-id: "ID_DO_SERVIDOR"
  
  # ID do canal onde as mensagens serão enviadas
  # Clique com botão direito no canal e "Copiar ID"
  canal-id: "ID_DO_CANAL"